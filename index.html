<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公众号 Markdown 编辑器</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        [v-cloak] {
            display: none;
        }
    </style>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .toolbar button,
        .toolbar select {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: #f0f0f0;
        }

        .toolbar button.primary {
            background: #07c160;
            color: white;
            border-color: #07c160;
        }

        .toolbar button.primary:hover {
            background: #06ad56;
        }

        .toolbar select {
            min-width: 150px;
        }

        .editor-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 200px);
            min-height: 600px;
        }

        /* 平板设备 (768px - 1024px) */
        @media (max-width: 1024px) and (min-width: 769px) {
            .editor-wrapper {
                gap: 15px;
                height: calc(100vh - 180px);
            }
            .container {
                padding: 15px;
            }
            .header {
                padding: 15px;
            }
            .toolbar {
                gap: 8px;
            }
            .toolbar button, .toolbar select {
                padding: 6px 12px;
                font-size: 13px;
            }
        }

        /* 手机设备 (最大 768px) */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 20px;
                margin-bottom: 12px;
            }
            
            .editor-wrapper {
                grid-template-columns: 1fr;
                height: auto;
                gap: 15px;
                min-height: auto;
            }
            
            .editor-panel, .preview-panel {
                padding: 15px;
                min-height: 300px;
            }
            
            .panel-title {
                font-size: 14px;
                margin-bottom: 12px;
            }
            
            .editor-textarea {
                font-size: 14px;
                padding: 12px;
                min-height: 300px;
            }
            
            .toolbar {
                flex-direction: column;
                gap: 8px;
            }
            
            .toolbar button, .toolbar select {
                width: 100%;
                padding: 10px;
                font-size: 14px;
            }
            
            .toolbar select {
                min-width: auto;
            }
        }

        /* 小屏手机 (最大 480px) */
        @media (max-width: 480px) {
            .container {
                padding: 8px;
            }
            
            .header {
                padding: 12px;
            }
            
            .header h1 {
                font-size: 18px;
            }
            
            .editor-panel, .preview-panel {
                padding: 12px;
                min-height: 250px;
            }
            
            .editor-textarea {
                font-size: 13px;
                padding: 10px;
                min-height: 250px;
            }
            
            .toolbar button, .toolbar select {
                padding: 8px;
                font-size: 13px;
            }
        }

        /* 横屏手机优化 */
        @media (max-width: 768px) and (orientation: landscape) {
            .editor-wrapper {
                grid-template-columns: 1fr 1fr;
                height: calc(100vh - 150px);
            }
            
            .editor-panel, .preview-panel {
                min-height: calc(100vh - 200px);
            }
        }

        .editor-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #666;
        }

        .editor-textarea {
            flex: 1;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .editor-textarea:focus {
            border-color: #07c160;
        }

        .preview-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .preview-content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .preview-content {
            background: white;
            transition: all 0.3s ease;
        }

        /* 手机预览模式 */
        .view-mode-mobile .preview-content {
            width: 375px;
            max-width: 375px;
            min-height: 600px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
        }

        /* 平板预览模式 */
        .view-mode-tablet .preview-content {
            width: 768px;
            max-width: 768px;
            min-height: 600px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
        }

        /* 桌面预览模式 */
        .view-mode-desktop .preview-content {
            width: 100%;
            max-width: 100%;
        }

        .view-mode-buttons {
            display: flex;
            gap: 4px;
        }

        .view-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background: #f5f5f5;
        }

        .view-btn.active {
            background: #07c160;
            color: white;
            border-color: #07c160;
        }

        .view-mode-label {
            margin-left: 10px;
            font-size: 12px;
            color: #999;
            font-weight: normal;
        }

        /* 移动端隐藏预览切换 */
        @media (max-width: 768px) {
            .view-mode-buttons {
                display: none;
            }

            .view-mode-label {
                display: none;
            }

            .preview-content-wrapper {
                padding: 0;
                background: transparent;
            }
        }

        .hidden-file-input {
            display: none;
        }

        .status-message {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal {
            width: min(900px, 100%);
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal h3 {
            font-size: 16px;
            margin: 0;
            color: #333;
        }

        .modal textarea {
            width: 100%;
            min-height: 260px;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>

<body>
    <div id="app" v-cloak>
        <div class="container">
            <div class="header">
                <h1>📝 公众号 Markdown 编辑器</h1>
                <div class="toolbar">
                    <select v-model="currentStyle" @change="updatePreview">
                        <option v-for="(style, key) in styles" :key="key" :value="key">
                            {{ style.name }}
                        </option>
                    </select>

                    <div class="view-mode-buttons">
                        <button :class="['view-btn', { active: viewMode === 'mobile' }]" @click="setViewMode('mobile')"
                            title="手机预览">📱</button>
                        <button :class="['view-btn', { active: viewMode === 'tablet' }]" @click="setViewMode('tablet')"
                            title="平板预览">📱</button>
                        <button :class="['view-btn', { active: viewMode === 'desktop' }]" @click="setViewMode('desktop')"
                            title="桌面预览">💻</button>
                    </div>

                    <input type="file" ref="fileInput" accept=".md,.markdown" class="hidden-file-input"
                        @change="handleFileUpload">
                    <button @click="$refs.fileInput.click()">📁 上传 .md</button>
                    <button @click="exportHTML">📄 导出 HTML</button>
                    <button @click="exportPDF">📑 导出 PDF</button>
                    <button @click="generateImage">📸 生成长图</button>
                    <button @click="copyToWeChat" class="primary">📋 复制到公众号</button>
                    <button @click="clearEditor">🗑️ 清空</button>
                </div>
                <div :class="['status-message', statusType]" v-if="statusMessage">
                    {{ statusMessage }}
                </div>
            </div>

            <div class="editor-wrapper">
                <div class="editor-panel">
                    <div class="panel-title">📝 编辑区</div>
                    <textarea class="editor-textarea" v-model="markdownContent" @input="scheduleUpdatePreview()"
                        placeholder="在这里输入 Markdown 内容，或从其他地方粘贴内容..."></textarea>
                </div>

                <div class="preview-panel">
                    <div class="panel-title">👀 预览区
                        <span class="view-mode-label">{{ viewModeLabel }}</span>
                    </div>
                    <div class="preview-content-wrapper" :class="'view-mode-' + viewMode">
                        <div v-html="renderedHTML" :id="'preview-' + currentStyle" class="preview-content"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-backdrop" v-if="isManualCopyOpen">
            <div class="modal" role="dialog" aria-modal="true">
                <h3>手动复制 HTML</h3>
                <div>复制失败时可手动复制以下内容再粘贴到公众号编辑器。</div>
                <textarea ref="manualCopyTextarea" v-model="manualCopyHtml"></textarea>
                <div class="modal-actions">
                    <button @click="copyManualHtml">复制 HTML</button>
                    <button @click="closeManualCopy">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="loader.js"></script>
</body>

</html>
